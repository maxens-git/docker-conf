version: "3"
services:
  metube:
    image: alexta69/metube
    labels:
      - "diun.enable=true"
    network_mode: nginx-proxy-manager_default
    container_name: metube
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      #- /docker/youtube/downloads:/downloads
      - /docker/jellyfin/movies:/downloads
