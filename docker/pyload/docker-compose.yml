version: "2.1"
services:
  pyload-ng:
    image: lscr.io/linuxserver/pyload-ng:latest
    container_name: pyload-ng
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /docker/pyload/appdata/config:/config
      - /docker/jellyfin/movies:/downloads
    ports:
      - 8122:8000
      - 9666:9666 #optional
    restart: unless-stopped
