version: '3.3'
services:
    yacht:
        ports:
            - '8120:8000'
        volumes:
            - '/var/run/docker.sock:/var/run/docker.sock'
            - '/docker/yacht:/config'
        image: selfhostedpro/yacht
        container_name: yacht
        labels:
            - "diun.enable=true"
        network_mode: nginx-proxy-manager_default
