---
# For configuration options and examples, please see:
# https://gethomepage.dev/latest/configs/services

- Raspberry:
    - Portainer:
        iocn: portainer.png
        href: https://192.168.1.X:9443
        description:
        container: portainer
        widget:
          type: portainer
          url: https://192.168.1.X:9443
          env: 2
          key: api
    - Immich:
        href: https://your-immich.duckdns.org
        container: immich_server
        widget:
          type: immich
          url: https://your-immich.duckdns.org
          key: api
    - Nginx proxy manager:
        href: http://192.168.1.X:81
        container: npm
        widget:
          type: npm
          url: http://192.168.1.X:81
          username: your@email.com
          password: changeme

- Oracle:
    - Minecraft:
        href: minecraft://localhost:25565
        description:
        widget:
          type: minecraft
          url: udp://your.server.ip:25565
#    - Uptime-kuma:
 #       href:
  #      widget:
   #       type: uptimekuma
    #      url: http://your.server.ip:8050/
     #     slug: statuspageslug

- Others:
    - Nextdns:
        href: my.nextdns.io
        widget:
          type: nextdns
          profile: perso
          key: api
