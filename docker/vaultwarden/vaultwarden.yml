version: '3.3'
services:
    server:
        container_name: vaultwarden
        labels:
            - diun.enable=true
        network_mode: nginx-proxy-manager_default #Si nginx proxy manager est installé
        volumes:
            - /docker/vaultwarden:/data/
        ports:
            - '5001:80'
        image: 'vaultwarden/server:latest'
        restart: always
        environment:
            - WEBSOCKET_ENABLED=${WEBSOCKET_ENABLED}
            - DOMAIN=${DOMAIN}
            - SIGNUPS_ALLOWED={SIGNUPS_ALLOWED} #True pour le premier démarrage
            - SMTP_HOST=${SMTP_HOST}
            - SMTP_FROM=${SMTP_FROM}
            - SMTP_PORT=${SMTP_PORT}
            - SMTP_SECURITY=starttls
            - SMTP_USERNAME=${SMTP_USERNAME}
            - SMTP_PASSWORD=${SMTP_PASSWORD}
