# yamllint disable rule:comments-indentation
---
###############################################################################
#                           Authelia Configuration                            #
###############################################################################

theme: dark #light/dark

identity_validation:
  reset_password:
    jwt_secret: 'REDACTED_SECRET' #any text or number you want to add here to create jwt Token

default_redirection_url: https://google.com #where to redirect for a non-existent URL


server:
  address: tcp://0.0.0.0:9091/

  buffers:
    read: 4096
    write: 4096
  endpoints:
    enable_pprof: false
    enable_expvars: false
  disable_healthcheck: false
  tls:
    key: ""
    certificate: ""

log:
  level: debug

totp:
  issuer: maxens.org #your authelia top-level domain
  period: 30
  skew: 1

authentication_backend:
  password_reset:
    disable: false
  refresh_interval: 5m
  file:
    path: /config/users_database.yml #this is where your authorized users are stored
    password:
      algorithm: argon2id
      iterations: 1
      key_length: 32
      salt_length: 16
      memory: 1024
      parallelism: 8

access_control:
  default_policy: deny
  rules:
    ## bypass rule
    - domain:
        - "auth.maxens.org" #This should be your authentication URL
      policy: bypass
    - domain: "uptime-kuma.maxens.org" #example domain to protect
      policy: one_factor

session:
  name: authelia_session
  secret: REDACTED_SECRET #any text or number you want to add here to create jwt Token
  expiration: 3600  # 1 hour
  inactivity: 300  # 5 minutes
  domain: maxens.org  # Should match whatever your root protected domain is

regulation:
  max_retries: 3
  find_time: 10m
  ban_time: 12h

storage:
  local:
    path: /config/db.sqlite3 #this is your databse. You could use a mysql database if you wanted, but we're going to use this one.
  encryption_key: REDACTED_KEY #added Dec 5 2021


notifier:
  disable_startup_check: false
  filesystem:
    filename: "/data/notification.txt"


identity_providers:
  oidc:
    hmac_secret: 'REDACTED_HMAC_SECRET' #chaine de 64 caractères
    jwks:
