version: "3"
services:
  metube:
    image: alexta69/metube
    labels:
      - "diun.enable=true"
    network_mode: nginx-proxy-manager_default
    container_name: metube
    restart: unless-stopped
    environment:
      YTDL_OPTIONS: '{"cookiefile":"/cookies/cookies.txt"}' #On peut obtenir le fichier cookies.txt via l'extension firefox / chrome : cookies.txt
    ports:
      - "8106:8081"
    volumes:
      - /docker/youtube/downloads:/downloads
      - /docker/youtube/cookies:/cookies
