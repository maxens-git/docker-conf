version: "3"
services:
  duplicati:
    image: lscr.io/linuxserver/duplicati
    container_name: duplicati
    labels:
      - "diun.enable=true"
    #network_mode: nginx-proxy-manager_default
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      #- CLI_ARGS= #optional
    volumes:
      - /docker/duplicati/config:/config
      - /docker/duplicati/backups:/backups
      - /docker:/source
    ports:
      - 8200:8200
    restart: unless-stopped
