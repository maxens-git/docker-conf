version: "2.1"
services:
  webhook:
    image: roxedus/webhook
    network_mode: npm1_default
    container_name: webhook
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - EXTRA_PARAM=-hotreload #optional
    volumes:
      - /docker/webhook:/config
    ports:
      - 9000:9000
