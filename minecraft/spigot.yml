version: '3.3'
services:
    minecraft-serve:
        volumes:
            - '/docker/minecraft-spigot/:/data'
        environment:
            - TYPE=SPIGOT
            - EULA=TRUE
            #- VERSION=1.17.1
            #- MODE=survival
            #- MEMORY=1G
            - MAX_PLAYERS=999999
        ports:
            - '25565:25565'
        container_name: minecraft-spigot
        image: itzg/minecraft-server
