version: '3.3'
services:
    web:
        image: itzg/rcon
        environment:
            RWA_USERNAME: admin
            RWA_PASSWORD: admin
            RWA_ADMIN: "TRUE"
            # is referring to the hostname of 'mc' compose service below
            RWA_RCON_HOST: minecraft-spigot
            # needs to match the password configured for the container, which is 'minecraft' by default
            RWA_RCON_PASSWORD: minecraft
        ports:
            - 4326:4326
            - 4327:4327
      
    minecraft-spigot:
        volumes:
            - '/docker/minecraft-spigot/:/data'
        environment:
            - TYPE=SPIGOT
            - EULA=TRUE
            - VERSION=1.19.4
            #- MODE=survival
            #- EXEC_DIRECTLY=true
            #- MEMORY=1G
            - MAX_PLAYERS=50
            #- ONLINE_MODE=true
        ports:
            - '25565:25565'
        container_name: minecraft-spigot
        image: itzg/minecraft-server
